<style>
:root{
  color-scheme:light;
  --bg:#E4ECF3; --paper:rgba(251,252,253,.95); --paper-line:#D8E1EA;
  --ink:#1E2944; --ink-soft:#4D5B76; --asagi:#22707C; --fuji:#6A5BA3; --akari:#9A6418; --beni:#A8423A;
  --s1:#F3C9A6; --s2:#7F9AC2; --s3:#5D7AA6; --night1:#1A2A55; --night2:#3E5687;
  --snow:#FFFFFF; --hill:#E9F0F6; --hill2:#CFDCE8; --mount:#8EA4BF; --mount2:#B4C5D8; --light:#F4C35E;
  --glass:rgba(255,255,255,.42); --glass-edge:rgba(255,255,255,.85); --glass-shade:rgba(30,41,68,.18);
  --chip:rgba(30,41,68,.06);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --dock:48px;
  --r-xl:44px; --r-card:30px; --r-row:18px; --r-ctl:24px; --pad-card:22px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1430; --paper:rgba(22,32,62,.93); --paper-line:#2A3A66;
    --ink:#EDF2F8; --ink-soft:#B3C0D4; --asagi:#7ACCD7; --fuji:#BCAFE7; --akari:#F2BE62; --beni:#F08C7F;
    --s1:#6E5C8E; --s2:#2C3F70; --s3:#16244A; --night1:#070E26; --night2:#1C2B58;
    --snow:#E8EEF6; --hill:#2A3A66; --hill2:#22325A; --mount:#1E2C55; --mount2:#273868; --light:#F7CB6B;
    --glass:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.24); --glass-shade:rgba(0,0,0,.45);
    --chip:rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1430; --paper:rgba(22,32,62,.93); --paper-line:#2A3A66;
  --ink:#EDF2F8; --ink-soft:#B3C0D4; --asagi:#7ACCD7; --fuji:#BCAFE7; --akari:#F2BE62; --beni:#F08C7F;
  --s1:#6E5C8E; --s2:#2C3F70; --s3:#16244A; --night1:#070E26; --night2:#1C2B58;
  --snow:#E8EEF6; --hill:#2A3A66; --hill2:#22325A; --mount:#1E2C55; --mount2:#273868; --light:#F7CB6B;
  --glass:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.24); --glass-shade:rgba(0,0,0,.45);
  --chip:rgba(255,255,255,.08);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{margin:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:17px;line-height:1.55;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;
  background:var(--glass);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%)}
.mincho{font-family:"Shippori Mincho","Noto Serif TC","Songti TC",serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--asagi);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* continuous (squircle) corners where the browser supports it */


/* ---------- functional layer: Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:0;
  box-shadow:0 16px 36px -14px var(--glass-shade)}
/* rim: thin edge, white on top and bottom, dark on left and right, blended by gradients */
:root{--rim-hi:rgba(255,255,255,.8);--rim-lo:rgba(20,28,50,.5);--rim-w:.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rim-hi:rgba(255,255,255,.4);--rim-lo:rgba(0,0,0,.95)}}
:root[data-theme="dark"]{--rim-hi:rgba(255,255,255,.4);--rim-lo:rgba(0,0,0,.95)}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rim-w);pointer-events:none;z-index:2;
  background:var(--rim-bg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 38%)}
.dock{position:fixed;z-index:30;right:0;bottom:0;
  padding:0 calc(12px + var(--sr)) calc(12px + var(--sb)) 0;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
/* sizes taken from the App Store sidebar on iPhone Duo: bar 48, items 44 wide, 52 apart, current-page well 44; radius = half the width */
.dock .grp{pointer-events:auto;width:var(--dock);border-radius:24px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:0;background:var(--glass-ctl)}
.dock .grp::after{display:none}
.dock .ic{width:21px;height:21px;stroke-width:1.6}
:root{--glass-ctl:rgba(255,255,255,.58)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-ctl:rgba(255,255,255,.13)}}
:root[data-theme="dark"]{--glass-ctl:rgba(255,255,255,.13)}
.dock button,.dock a{width:44px;height:44px;min-height:0;flex:0 0 44px;border:0;background:none;color:var(--ink);cursor:pointer;
  border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-decoration:none;font:inherit;font-size:11px;font-weight:500;line-height:1.2;position:relative;z-index:1;padding:6px 0}
.dock a[aria-current="page"]::before,.dock button[aria-expanded="true"]::before{content:"";position:absolute;inset:4px;border-radius:50%;z-index:-1;
  background:var(--glass)}
:root{--ease-sp:cubic-bezier(.32,.72,0,1)}
/* expand / collapse: the capsule grows by animating its grid row, items rise in one after another */
.dock .menu{display:grid;grid-template-rows:0fr;margin-bottom:0;transition:grid-template-rows .46s var(--ease-sp),margin-bottom .46s var(--ease-sp)}
.dock .menu .mi{min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:0}
.dock .menu a{height:52px;flex-basis:52px;border-radius:22px}
.dock .menu a{opacity:0;transform:translateY(12px) scale(.82);filter:blur(4px);
  transition:opacity .2s ease,transform .32s var(--ease-sp),filter .2s ease}
.dock .menu.open a{opacity:1;transform:none;filter:none;transition:opacity .32s ease,transform .5s var(--ease-sp),filter .32s ease}
.dock .menu.open a:nth-child(5){transition-delay:0ms}.dock .menu.open a:nth-child(4){transition-delay:35ms}.dock .menu.open a:nth-child(3){transition-delay:45ms}
.dock .menu.open a:nth-child(2){transition-delay:90ms}.dock .menu.open a:nth-child(1){transition-delay:135ms}
.dock .menu:not(.open) a:nth-child(1){transition-delay:0ms}.dock .menu:not(.open) a:nth-child(2){transition-delay:25ms}
.dock .menu:not(.open) a:nth-child(3){transition-delay:50ms}.dock .menu:not(.open) a:nth-child(4){transition-delay:75ms}.dock .menu:not(.open) a:nth-child(5){transition-delay:100ms}
/* menu button: three lines morph into a close mark */
.burger path{transform-box:fill-box;transform-origin:center;transition:transform .46s var(--ease-sp),opacity .2s ease}
#menuBtn[aria-expanded="true"] .burger .l1{transform:translateY(5px) rotate(45deg)}
#menuBtn[aria-expanded="true"] .burger .l2{opacity:0;transform:scaleX(.2)}
#menuBtn[aria-expanded="true"] .burger .l3{transform:translateY(-5px) rotate(-45deg)}
#menuBtn::before{content:"";position:absolute;inset:4px;border-radius:50%;z-index:-1;background:var(--glass);opacity:0;transform:scale(.5);transition:opacity .3s ease,transform .46s var(--ease-sp)}
#menuBtn[aria-expanded="true"]::before{opacity:1;transform:none}
.dock .menu.open{grid-template-rows:1fr;margin-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[tabindex="-1"]:focus{outline:none}

/* ---------- content layer: opaque ---------- */
.page{padding-left:var(--sl)}
.scene{position:relative;height:min(58vh,520px);overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .vt{position:absolute;right:max(22px,calc(50% - 440px));top:clamp(28px,8vh,72px);
  writing-mode:vertical-rl;margin:0;font-weight:800;letter-spacing:.12em;line-height:1.1;color:#fff;
  font-size:clamp(40px,10vw,76px);text-shadow:0 2px 18px rgba(10,20,50,.35)}
.scene .vt small{display:block;font-size:.3em;font-weight:500;letter-spacing:.3em;margin-right:.6em;opacity:.92}
.scene .fade{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(transparent,var(--bg))}
.wrap{max-width:900px;margin:0 auto;position:relative;z-index:2;
  --pl:16px;--pr:calc(16px + var(--sr));padding:0 var(--pr) 120px var(--pl)}
.paper{background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--r-card);padding:var(--pad-card);
  box-shadow:0 24px 50px -30px var(--glass-shade)}
.paper + .paper,.paper + .small,.paper + .pager{margin-top:16px}

/* Apple text styles */
.t-large{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em}
.t-title{font-size:28px;line-height:1.22;font-weight:700}
.t-title2{font-size:22px;line-height:1.28;font-weight:700}
.t-headline{font-size:17px;line-height:1.3;font-weight:600}
.t-sub{font-size:15px;line-height:1.4;color:var(--ink-soft)}
.t-foot{font-size:13px;line-height:1.35;color:var(--ink-soft)}
.t-cap{font-size:12px;line-height:1.3;color:var(--ink-soft)}

/* home */
.home .scene{height:min(90vh,760px)}
.ticket{position:absolute;left:max(18px,calc(50% - 440px));bottom:148px;width:min(72vw,360px);border-radius:28px;padding:18px 20px 16px;color:var(--ink)}
.ticket .r{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.ticket .r b{font-size:clamp(22px,6vw,28px);font-weight:800;letter-spacing:.06em}
.ticket .r span{flex:1;border-bottom:2px dashed var(--asagi);transform:translateY(-7px)}
.ticket .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft)}
.ticket .foot{margin-top:10px;padding-top:8px;border-top:1px dashed var(--glass-edge);display:flex;justify-content:space-between;font-size:13px}
.ticket .stamp{position:absolute;right:16px;top:16px;width:52px;height:52px;border-radius:50%;border:2px solid var(--beni);color:var(--beni);
  display:grid;place-items:center;font-size:12px;font-weight:700;transform:rotate(-12deg);line-height:1.15;text-align:center}
.intro h2{margin:0 0 8px;font-size:22px;line-height:1.45;font-weight:700}
.intro p{margin:0;color:var(--ink-soft);font-size:15px;max-width:34em}
.line{margin:18px calc(var(--pad-card) * -1) 0;padding:0 var(--pad-card) 4px;overflow-x:auto;scrollbar-width:none}
.line::-webkit-scrollbar{display:none}
.line ol{list-style:none;margin:0;padding:0;display:flex;min-width:420px;position:relative}
.line ol::before{content:"";position:absolute;left:8%;right:8%;top:17px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--asagi),var(--fuji))}
.line li{flex:1;text-align:center}
.line a{display:block;min-height:44px;text-decoration:none;font-size:12px;color:var(--ink-soft);padding:4px 2px 6px;border-radius:14px}
.line a::before{content:"";display:block;width:18px;height:18px;margin:4px auto 8px;border-radius:50%;background:var(--paper);border:4px solid var(--asagi);position:relative}
.line a b{display:block;font-size:16px;color:var(--ink);font-weight:700;letter-spacing:.04em}
/* inset grouped rows, separators inset to the text */
.hl{list-style:none;margin:0;padding:0}
.hl li{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 0;position:relative}
.hl li + li::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--paper-line)}
.hl li:first-child{padding-top:0}.hl li:last-child{padding-bottom:0}
.hl .k{width:52px;height:52px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-size:28px;line-height:1;color:var(--asagi);font-weight:800}
.hl h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.hl p{margin:3px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.4}
.hl a{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:15px;color:var(--asagi);text-decoration:none;font-weight:500}
.hl a .ic{width:16px;height:16px}

/* day */
.dhead{display:flex;gap:14px;align-items:center}
.dhead .num{width:64px;height:64px;flex:0 0 64px;border-radius:20px;background:var(--chip);display:grid;place-items:center;font-size:40px;line-height:1;font-weight:800;color:var(--asagi)}
.dhead h1{margin:0;font-size:28px;line-height:1.22;font-weight:700}
.dhead p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
.kind{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:500;padding:5px 14px 5px 11px;border-radius:999px;background:var(--chip)}
.kind .ic{width:16px;height:16px}
/* home: route map and day cards */
.sec-h{margin:0;font-size:22px;line-height:1.28;font-weight:700}
.sec-h.out{margin:28px 4px 0}
.map{display:block;width:100%;height:auto;margin-top:12px}
.map text{font-family:"Shippori Mincho","Noto Serif TC",serif}
.days{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px calc(-1 * var(--pr)) 0 calc(-1 * var(--pl));padding:2px var(--pr) 14px var(--pl);scroll-padding:0 var(--pl);scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--pl),#000 calc(100% - 64px),transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 var(--pl),#000 calc(100% - 64px),transparent 100%)}
.days::-webkit-scrollbar{display:none}
.dc{flex:0 0 min(68%,250px);scroll-snap-align:start;text-decoration:none;background:var(--paper);border:1px solid var(--paper-line);border-radius:24px;overflow:hidden;box-shadow:0 20px 40px -28px var(--glass-shade)}
.dc-art{position:relative;aspect-ratio:16/10;overflow:hidden;
  /* the picture dissolves into the card instead of ending on a hard line */
  -webkit-mask-image:linear-gradient(to bottom,#000 52%,transparent 100%);mask-image:linear-gradient(to bottom,#000 52%,transparent 100%)}
.dc-tx{margin-top:-18px;position:relative}
/* map: the island is cropped by the frame, so its cut edges fade out instead of ending on straight lines */

(function(){
/* ---------- scenes: one illustration system ----------

function prog(){var b=app.querySelectorAll('.check input'),n=0;b.forEach(function(x){if(x.checked)n++;});var p=document.getElementById('prog');if(p)p.textContent='已完成 '+n+' / '+b.length;}

var dayGrp=document.getElementById('dayGrp'),pv=document.getElementById('prevDay'),nx=document.getElementById('nextDay');
[pv,nx].forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var h=a.dataset.href;if(h)location.hash=h;});
 a.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();a.click();}});});
function route(){
 var h=(location.hash||'').replace('#','')||'home';
 var idx=D.findIndex(function(d){return d.id===h;});
 var tab='home',html,title='首頁';
 if(idx>-1){html=day(idx);tab='day';title=D[idx].title;}
 else if(h==='stay'){html=stay();tab='stay';title='住宿';}
 else if(h==='prep'){html=prep();tab='prep';title='出發前';}
 else if(h==='info'){html=info();tab='info';title='旅途須知';}
 else{html=home();}
 app.innerHTML=html;
 document.title=title+'｜北海道雪見六日';
 menu.querySelectorAll('a').forEach(function(a){if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
 if(idx>-1){dayGrp.hidden=false;
   var p=idx>0?['#'+D[idx-1].id,'上一日：'+D[idx-1].title]:['#home','回到首頁'];
   var q=idx<D.length-1?['#'+D[idx+1].id,'下一日：'+D[idx+1].title]:['#prep','接著看出發前準備'];
   pv.dataset.href=p[0];pv.setAttribute('aria-label',p[1]);nx.dataset.href=q[0];nx.setAttribute('aria-label',q[1]);
 }else{dayGrp.hidden=true;}
 setMenu(false);
 window.scrollTo(0,0);
 if(tab==='prep'){prog();app.querySelectorAll('.check input').forEach(function(x){x.addEventListener('change',function(){
   var d={};try{d=JSON.parse(localStorage.getItem('prep')||'{}');}catch(e){}
   d[x.dataset.i]=x.checked;try{localStorage.setItem('prep',JSON.stringify(d));}catch(e){} prog();});});}
 var h1=app.querySelector('h1');if(h1&&location.hash){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true});}
}
function ORD(h){if(!h||h==='home')return 0;var i=D.findIndex(function(d){return d.id===h;});if(i>-1)return i+1;return h==='stay'?7:h==='prep'?8:h==='info'?9:0;}
var lastOrd=ORD((location.hash||'').slice(1));
var RM=matchMedia('(prefers-reduced-motion: reduce)'),navTok=0;
/* only the page content (#app) animates; the dock is never part of the transition, so it stays pinned */
var outAnim=null;
function go(){
 var o=ORD((location.hash||'').slice(1));var dir=o>lastOrd?'fwd':(o<lastOrd?'back':'same');lastOrd=o;
 var tok=++navTok;
 if(!app.animate){route();return;}
 if(outAnim){outAnim.cancel();outAnim=null;}
 var rm=RM.matches,x=rm?0:(dir==='fwd'?-14:(dir==='back'?14:0));
 var wr=app.querySelector('.wrap'),dur=rm?140:260,ez='cubic-bezier(.4,0,1,1)';
 var fromT=(wr&&wr.style.transform)||'none',fromO=app.style.opacity||'1';if(wr)wr.style.transform='';app.style.opacity='';
 /* transform only the content column: a transformed ancestor would un-pin the fixed left card */
 if(wr)wr.animate([{transform:fromT},{transform:'translateX('+x+'px)'}],{duration:dur,easing:ez,fill:'forwards'});
 outAnim=app.animate([{opacity:fromO},{opacity:0}],{duration:dur,easing:ez,fill:'forwards'});
 outAnim.onfinish=function(){
  if(tok!==navTok)return;
  route();
  var a=outAnim,nw=app.querySelector('.wrap'),di=rm?220:520,ei='cubic-bezier(.2,.8,.2,1)';outAnim=null;
  app.animate([{opacity:0},{opacity:1}],{duration:di,easing:ei});
  if(nw)nw.animate([{transform:'translateX('+(-x)+'px)'},{transform:'none'}],{duration:di,easing:ei});
  a.cancel();
 };
}
/* swipe left / right on a day page to go to the next / previous page; the page follows the finger */
(function(){
 var sx,sy,st,dx=0,axis=null,on=false;
 function onDay(){return !dayGrp.hidden;}
 app.addEventListener('touchstart',function(e){
  if(!onDay()||e.touches.length!==1)return;
  var t=e.touches[0];if(t.clientX<24||t.clientX>innerWidth-24)return; /* leave the screen edges to the system back gesture */
  if(e.target.closest('.days,.line,input,label'))return;
  sx=t.clientX;sy=t.clientY;st=Date.now();dx=0;axis=null;on=true;
 },{passive:true});
 app.addEventListener('touchmove',function(e){
  if(!on)return;var t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
  if(!axis){if(Math.abs(mx)<10&&Math.abs(my)<10)return;axis=Math.abs(mx)>Math.abs(my)*1.3?'x':'y';}
  if(axis!=='x'){on=false;return;}
  dx=mx;if(RM.matches)return;var wr=app.querySelector('.wrap');
  if(wr)wr.style.transform='translateX('+(dx*.32).toFixed(1)+'px)';app.style.opacity=(1-Math.min(Math.abs(dx)/900,.35)).toFixed(3);
 },{passive:true});
 function end(){
  if(!on)return;on=false;
  var fast=Math.abs(dx)>40&&Date.now()-st<300,commit=axis==='x'&&(Math.abs(dx)>90||fast);
  if(commit){var a=dx<0?nx:pv;if(a&&a.dataset.href){location.hash=a.dataset.href;return;}}
  var wr=app.querySelector('.wrap');
  if(wr&&wr.style.transform){var ft=wr.style.transform,fo=app.style.opacity||'1';wr.style.transform='';app.style.opacity='';
   if(wr.animate){wr.animate([{transform:ft},{transform:'none'}],{duration:360,easing:'cubic-bezier(.32,.72,0,1)'});app.animate([{opacity:fo},{opacity:1}],{duration:360});}}
 }
 app.addEventListener('touchend',end);app.addEventListener('touchcancel',end);
})();
window.addEventListener('hashchange',go);
route();

/* snow */
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var DM=matchMedia('(prefers-color-scheme: dark)');
var c=document.getElementById('snow'),ctx=c.getContext('2d'),W,H,F=[],dpr=Math.min(window.devicePixelRatio||1,1.5);
function sz(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';}
sz();addEventListener('resize',sz);
var n=Math.min(42,Math.round(innerWidth/18));
for(var i=0;i<n;i++)F.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.8+.8)*dpr,s:(Math.random()*.5+.25)*dpr,d:Math.random()*6});
(function draw(){if(document.hidden){requestAnimationFrame(draw);return;}ctx.clearRect(0,0,W,H);ctx.fillStyle=DM.matches?'rgba(255,255,255,.85)':'rgba(110,135,175,.55)';
 for(var i=0;i<F.length;i++){var f=F[i];f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.35*dpr;if(f.y>H){f.y=-4;f.x=Math.random()*W;}
 ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}
 requestAnimationFrame(draw);})();
})();
